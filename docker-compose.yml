services:
  db:
    image: pgvector/pgvector:pg16
    container_name: tablemind-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tablemind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tablemind}
      POSTGRES_DB: ${POSTGRES_DB:-tablemind}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-tablemind}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tablemind-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    container_name: tablemind-backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tablemind}:${POSTGRES_PASSWORD:-tablemind}@db:5432/${POSTGRES_DB:-tablemind}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: tablemind-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
